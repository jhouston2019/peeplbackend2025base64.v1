workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Build APK
        script: flutter build apk --release
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/**/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - a
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          openssl genrsa -out /tmp/certificate_key.pem 2048
          export CERTIFICATE_PRIVATE_KEY=$(cat /tmp/certificate_key.pem)
          app-store-connect fetch-signing-files com.peepl.app \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Use provisioning profiles
        script: xcode-project use-profiles
        working_directory: peepl_mobile
      - name: Build iOS
        script: flutter build ipa --release
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
