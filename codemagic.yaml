workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Build APK
        script: flutter build apk --release
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/**/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      groups:
        - a
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Install certificate and profile
        script: |
          # Decode and import certificate
          echo $CM_CERTIFICATE | base64 --decode > /tmp/distribution.p12
          
          # Create and configure keychain
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          # Import certificate
          security import /tmp/distribution.p12 -k build.keychain -P peepl123 -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          # Verify certificate imported
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          
          # Install provisioning profile
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a 'UUID' -A1 /tmp/profile.mobileprovision | grep -o '[-A-Za-z0-9]\{36\}')
          echo "Installing profile with UUID: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
      - name: Build iOS
        script: |
          cd peepl_mobile
          flutter build ipa --release \
            --export-options-plist=/tmp/ExportOptions.plist
        
      - name: Create ExportOptions
        script: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MJZ3VHZ23U</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution: James Houston (MJZ3VHZ23U)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.peepl.app</key>
              <string>Peepl App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
      - name: Build iOS
        script: |
          cd peepl_mobile
          flutter build ipa --release \
            --export-options-plist=/tmp/ExportOptions.plist
    artifacts:
      - peepl_mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
