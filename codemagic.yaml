workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Build APK
        script: flutter build apk --release
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/**/outputs/**/*.apk
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.peepl.app
      groups:
        - a
    scripts:
      - name: Install CocoaPods
        script: |
          sudo gem install cocoapods
      - name: Flutter clean and pub get
        script: |
          set -e
          flutter clean
          flutter pub get
        working_directory: peepl_mobile
      - name: Install iOS dependencies
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          test -d Pods
        working_directory: peepl_mobile
      - name: Flutter build iOS (release, no codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign
        working_directory: peepl_mobile
      - name: Debug signing resolution
        working_directory: peepl_mobile
        script: |
          xcode-project use-profiles || true
          echo "---- INSTALLED PROFILES ----"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "---- SIGNING IDENTITIES ----"
          security find-identity -v -p codesigning || true
          echo "---- BUILD SETTINGS ----"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings | grep -E "CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" || true
      - name: Build IPA (signed)
        working_directory: peepl_mobile
        script: |
          set -e
          xcode-project use-profiles || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM=MJZ3VHZ23U \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa
    artifacts:
      - peepl_mobile/build/ios/ipa/*.ipa
 publishing:
      app_store_connect:
        submit_to_testflight: true
