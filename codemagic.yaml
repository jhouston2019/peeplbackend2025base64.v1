workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.41.6
      android_signing:
        - peepl_keystore
      groups:
        - a
    scripts:
      - name: Flutter clean and pub get
        script: |
          set -e
          flutter clean
          flutter pub get
        working_directory: peepl_mobile
      - name: Build AAB
        script: |
          set -e
          flutter build appbundle --release \
            --dart-define=GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: 26.0
      flutter: 3.41.6
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.peepl.app
      groups:
        - a
    scripts:
      - name: Install CocoaPods
        script: |
          gem install cocoapods -v 1.14.3
      - name: Flutter clean and pub get
        script: |
          set -e
          flutter clean
          flutter pub get
        working_directory: peepl_mobile
      - name: Install iOS dependencies
        script: |
          set -e
          cd ios
          pod repo update
          pod install --repo-update
          test -d Pods
        working_directory: peepl_mobile
      - name: Flutter build iOS (release, no codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign --dart-define=GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY
        working_directory: peepl_mobile
      - name: Debug signing resolution
        working_directory: peepl_mobile
        script: |
          xcode-project use-profiles || true
          echo "---- INSTALLED PROFILES ----"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo "---- SIGNING IDENTITIES ----"
          security find-identity -v -p codesigning || true
          echo "---- BUILD SETTINGS ----"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings | grep -E "CODE_SIGN|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" || true
      - name: Build IPA (signed)
        working_directory: peepl_mobile
        script: |
          set -e
          xcode-project use-profiles || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM=MJZ3VHZ23U \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            clean archive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa
    artifacts:
      - peepl_mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
