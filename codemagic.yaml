workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Build APK
        script: flutter build apk --release
        working_directory: peepl_mobile
    artifacts:
      - peepl_mobile/build/**/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.peepl.app
      groups:
        - a
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
        working_directory: peepl_mobile
      - name: Build iOS
        script: |
          cd peepl_mobile
          flutter build ipa --release
    artifacts:
      - peepl_mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
